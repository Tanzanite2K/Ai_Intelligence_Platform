name: ai-intelligence-platform
x-app: &app
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://aip:aip@postgres:5432/aip
    REDIS_URL: redis://redis:6379/0
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
  volumes: ["./data:/app/data"]

services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: aip, POSTGRES_PASSWORD: aip, POSTGRES_DB: aip}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U aip"], interval: 5s, retries: 20}
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 20}
  api:
    <<: *app
    command: ["python", "-m", "src.main", "serve"]
    ports: ["8000:8000"]
  worker:
    <<: *app
    command: ["celery", "-A", "src.pipelines.tasks", "worker", "-Q", "ingest,export", "--concurrency", "4", "--loglevel", "INFO"]
    deploy: {replicas: 2}
  beat:
    <<: *app
    command: ["celery", "-A", "src.pipelines.tasks", "beat", "--loglevel", "INFO"]
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes: ["./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:11.1.0
    environment: {GF_AUTH_ANONYMOUS_ENABLED: "true"}
    volumes: ["./deploy/grafana/provisioning:/etc/grafana/provisioning:ro"]
    ports: ["3000:3000"]
  # Optional stores (enable with: docker compose --profile graph up)
  qdrant:
    image: qdrant/qdrant:v1.10.0
    profiles: ["graph"]
    ports: ["6333:6333"]
  neo4j:
    image: neo4j:5.20-community
    profiles: ["graph"]
    # Password comes from NEO4J_PASSWORD in .env (never committed). Unset -> "neo4j/" is rejected and the container
    # refuses to start instead of running with a well-known default password.
    environment: {NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-}"}
    ports: ["7474:7474", "7687:7687"]
volumes:
  pgdata:
