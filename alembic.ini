# Alembic configuration for FrontierAtlas (Phase 7A).
#
# The target database is NOT taken from this file. migrations/env.py resolves it, in order, from:
#   1. -x db_url=<sqlalchemy url>            (command line)
#   2. ALEMBIC_DATABASE_URL                   (environment)
#   3. DATABASE_URL / settings.database_url   (the application's own setting)
# and refuses to touch the live data/platform.db unless -x allow_live=yes is given.
# See docs/MIGRATIONS.md before running any command.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
version_path_separator = os
file_template = %%(rev)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
